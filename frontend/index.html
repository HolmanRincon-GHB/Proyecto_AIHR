<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechnoDistrib · Agente de RH y Talento Humano</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #ece3d3;
    --bg-glow-cyan: rgba(184, 141, 71, .10);
    --bg-glow-gold: rgba(212, 175, 55, .16);
    --surface: rgba(253, 249, 240, .92);
    --surface-solid: #fbf6ea;
    --surface-2: rgba(90, 62, 27, .05);
    --border-soft: rgba(90, 62, 27, .14);
    --text: #3a2f22;
    --text-muted: #8a7457;
    --metal-1: #b8863f;
    --metal-2: #a9762c;
    --metal-3: #6e4c1c;
    --accent: #a9762c;
    --accent-ink: #2c2013;
    --cyan: #7c5a2e;
    --ok: #3f8f5e;
    --danger: #b3453a;
    --danger-soft: rgba(179, 69, 58, .10);
    --radius-lg: 0px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    background:
      radial-gradient(900px 480px at 12% -8%, var(--bg-glow-gold), transparent 62%),
      radial-gradient(700px 520px at 100% 20%, var(--bg-glow-cyan), transparent 68%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    display: flex;
    justify-content: center;
    padding: clamp(14px, 3.4vw, 44px);
    min-height: 100vh;
  }

  .console {
    width: 100%;
    max-width: 1280px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - clamp(28px, 6.8vw, 88px));
    min-height: 580px;
    background:
      linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
      linear-gradient(155deg, var(--metal-1), var(--metal-2) 32%, var(--metal-3) 52%, var(--metal-1) 78%, var(--metal-2)) border-box;
    border: 1.4px solid transparent;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow:
      0 30px 60px -20px rgba(0, 0, 0, .65),
      0 0 0 1px rgba(0, 0, 0, .35),
      0 2px 24px rgba(212, 175, 55, .08);
    position: relative;
  }

  /* -- Banner -- */

  .banner {
    width: 100%;
    line-height: 0;
    position: relative;
  }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, var(--surface-solid) 100%);
  }
  .banner img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* -- Header -- */

  header {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .status-dot.online { background: var(--ok); box-shadow: 0 0 0 4px rgba(63, 143, 94, .18), 0 0 10px rgba(63, 143, 94, .5); }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 0 4px rgba(179, 69, 58, .16); }

  .header-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .header-title .name {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: .01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: linear-gradient(120deg, var(--metal-1), var(--metal-2) 55%, var(--metal-1));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .header-title .sub {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  header .spacer { flex: 1; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
    transition: border-color .2s, color .2s;
  }
  .icon-btn:hover { border-color: var(--metal-2); color: var(--metal-1); }
  .icon-btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* -- Settings drawer -- */

  .settings {
    border-bottom: 1px solid var(--border-soft);
    background: rgba(90, 62, 27, .05);
    padding: 16px 20px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .settings.open { display: flex; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-muted);
  }
  .field input {
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: #fffdf7;
    color: var(--text);
  }
  .field input:read-only { color: var(--text-muted); }

  .settings-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .settings-row .field { flex: 1; min-width: 0; }

  .btn {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .2s;
  }
  .btn:hover { border-color: var(--metal-2); }
  .btn.ghost-danger { color: var(--danger); }
  .btn.ghost-danger:hover { border-color: var(--danger); }

  /* -- Message log -- */

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg { display: flex; flex-direction: column; gap: 5px; max-width: 86%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .msg.system { align-self: center; max-width: 100%; align-items: center; }

  .msg .role {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, var(--metal-1), var(--metal-2) 65%);
    color: var(--accent-ink);
    font-weight: 500;
    padding: 11px 16px;
    border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
    font-size: 14px;
    line-height: 1.55;
    box-shadow: 0 6px 16px -6px rgba(169, 118, 44, .45);
  }

  .msg.agent .bubble {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    padding: 11px 15px;
    border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }

  .msg.system .bubble {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid rgba(179, 69, 58, .28);
    padding: 9px 14px;
    border-radius: var(--radius-sm);
  }

  .meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 15px;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
    width: fit-content;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--metal-2);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; opacity: .6; }
  }

  /* -- Traza de agentes (progreso en vivo del multiagente) -- */

  .trace {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 13px;
    background: #3a2f22;
    border: 1px solid var(--border-soft);
    border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
    width: fit-content;
    max-width: 100%;
  }
  .trace-line {
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.6;
    color: #e7d7b8;
    white-space: pre-wrap;
    opacity: 0;
    animation: trace-in .25s ease-out forwards;
  }
  @keyframes trace-in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  .trace-line.rag { color: #e0b45c; }

  .trace-details {
    width: fit-content;
    max-width: 100%;
  }
  .trace-details summary {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .03em;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 2px;
    list-style: none;
  }
  .trace-details summary::-webkit-details-marker { display: none; }
  .trace-details summary::before { content: '▸ '; }
  .trace-details[open] summary::before { content: '▾ '; }
  .trace-details .trace {
    margin-top: 4px;
    animation: none;
  }
  .trace-details .trace-line { animation: none; opacity: 1; }

  .prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    padding: 0 20px 16px;
  }
  .chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .chip:hover { border-color: var(--metal-2); color: var(--metal-1); }

  /* -- Composer -- */

  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 16px 18px;
    border-top: 1px solid var(--border-soft);
    background: linear-gradient(0deg, rgba(255,255,255,.03), transparent);
  }

  .prompt-mark {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    color: var(--metal-2);
    font-size: 19px;
    line-height: 1;
    padding-bottom: 12px;
  }

  textarea#input {
    flex: 1;
    resize: none;
    max-height: 140px;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    padding: 11px 16px;
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    background: #fffdf7;
    color: var(--text);
  }
  textarea#input:focus-visible { outline-offset: 0; border-color: var(--metal-2); }
  textarea#input { caret-color: var(--metal-2); scrollbar-width: thin; scrollbar-color: var(--border-soft) transparent; }
  textarea#input::-webkit-scrollbar { width: 6px; }
  textarea#input::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 3px; }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
    background: linear-gradient(155deg, var(--metal-1), var(--metal-2) 60%, var(--metal-3));
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 6px 16px -6px rgba(169, 118, 44, .55), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s, filter .15s;
  }
  .send-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .send-btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }

  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 4px; }
</style>
</head>
<body>


<div class="console">
  <div class="banner">
    <img src="/static/images/banner.png" alt="TechnoDistrib - Agente de RH y Talento Humano" />
    </div>
  <header>
    <span class="status-dot" id="statusDot"></span>
    <div class="header-title">
      <span class="name" id="agentNameLabel">Asistente</span>
      <span class="sub" id="statusSub">conectando…</span>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="settingsToggle" title="Configuración" aria-label="Configuración"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
  </header>

  <div class="settings" id="settingsPanel">
    <div class="settings-row">
      <div class="field">
        <label for="apiBaseInput">URL de la API</label>
        <input id="apiBaseInput" type="text" placeholder="http://localhost:8000" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn" id="saveSettings">Guardar</button>
    </div>
    <div class="settings-row">
      <div class="field">
        <label>Sesión activa</label>
        <input id="sessionIdView" type="text" readonly>
      </div>
      <button class="btn ghost-danger" id="newSession">Nueva conversación</button>
    </div>
  </div>

  <div class="log" id="log"></div>

  <div class="prompts" id="prompts">
    <button class="chip" data-prompt="¿Cuál fue el resultado de la encuesta de clima laboral?">Resultados Clima Laboral</button>
    <button class="chip" data-prompt="¿Cuál es el factor que más impacta el desempeño de los empleados, y tiene relación con la encuesta de clima?">Factores de desempeño</button>
    <button class="chip" data-prompt="¿Qué está haciendo la empresa para retener a los empleados en riesgo de renuncia?">Beneficios y Retención</button>
    <button class="chip" data-prompt="¿Cuánto le cuesta a la empresa la rotación de personal y cómo se compara entre áreas?">Indicadores Generales RH</button>
    <button class="chip" data-prompt="¿Cuál es el plan de pensiones de la empresa?">**Pregunta trampa**</button>
    
  </div>

  <div class="composer">
    <span class="prompt-mark">&gt;</span>
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" autocomplete="off"></textarea>
    <button class="send-btn" id="sendBtn" aria-label="Enviar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20L20 12L4 4V10L14 12L4 14V20Z" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const log            = $('log');
  const input          = $('input');
  const sendBtn         = $('sendBtn');
  const statusDot       = $('statusDot');
  const statusSub       = $('statusSub');
  const agentNameLabel  = $('agentNameLabel');
  const settingsToggle  = $('settingsToggle');
  const settingsPanel   = $('settingsPanel');
  const apiBaseInput    = $('apiBaseInput');
  const saveSettings    = $('saveSettings');
  const sessionIdView   = $('sessionIdView');
  const newSessionBtn   = $('newSession');
  const promptsBar      = $('prompts');

  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function defaultApiBase() {
    if (location.protocol.startsWith('http') && location.hostname !== '' ) {
      // Si esta página se sirve desde el mismo backend, úsalo por defecto.
      // Si se abre como archivo local o desde otro origen, apunta a localhost:8000.
      return location.origin.includes('localhost') || location.origin.includes('127.0.0.1')
        ? location.origin.replace(/:\d+$/, ':8000')
        : location.origin;
    }
    return 'http://localhost:8000';
  }

  function newSessionId() {
    return 'web_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  let apiBase   = store.get('agentApiBase', defaultApiBase());
  let sessionId = store.get('agentSessionId', newSessionId());
  store.set('agentSessionId', sessionId);

  apiBaseInput.value  = apiBase;
  sessionIdView.value = sessionId;

  function addMessage(role, text, meta) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const roleLabel = document.createElement('div');
    roleLabel.className = 'role';
    roleLabel.textContent = role === 'user' ? 'tú' : role === 'agent' ? agentNameLabel.textContent : 'sistema';
    if (role !== 'system') wrap.appendChild(roleLabel);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (meta) {
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.textContent = meta;
      wrap.appendChild(metaEl);
    }

    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.id = 'typingIndicator';
    const t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(t);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function hideTyping() {
    const el = $('typingIndicator');
    if (el) el.remove();
  }

  async function checkHealth() {
    try {
      const res = await fetch(apiBase + '/health/detail', { signal: AbortSignal.timeout(6000) });
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      statusDot.className = 'status-dot online';
      agentNameLabel.textContent = data.agente || 'Asistente';
      statusSub.textContent = (data.proveedor || 'groq') + ' · ' + (data.modelo || 'modelo desconocido');
      return true;
    } catch (e) {
      statusDot.className = 'status-dot offline';
      statusSub.textContent = 'sin conexión — revisa la URL de la API';
      return false;
    }
  }

  function createTraceMessage() {
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';

    const roleLabel = document.createElement('div');
    roleLabel.className = 'role';
    roleLabel.textContent = agentNameLabel.textContent;
    wrap.appendChild(roleLabel);

    const trace = document.createElement('div');
    trace.className = 'trace';
    wrap.appendChild(trace);

    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  function appendTraceLine(wrap, linea) {
    const trace = wrap.querySelector('.trace');
    if (!trace) return;
    const lineEl = document.createElement('div');
    lineEl.className = 'trace-line' + (linea.includes('📚') ? ' rag' : '');
    lineEl.textContent = linea;
    trace.appendChild(lineEl);
    log.scrollTop = log.scrollHeight;
  }

  function finalizeTraceMessage(wrap, respuesta, fuentes) {
    const trace = wrap.querySelector('.trace');

    if (trace) {
      const details = document.createElement('details');
      details.className = 'trace-details';
      const summary = document.createElement('summary');
      summary.textContent = 'Ver pasos del equipo multiagente';
      details.appendChild(summary);
      trace.remove();
      details.appendChild(trace);
      wrap.appendChild(details);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = respuesta;
    wrap.appendChild(bubble);

    if (fuentes && fuentes.length) {
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.textContent = 'fuentes: ' + fuentes.join(', ');
      wrap.appendChild(metaEl);
    }

    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage(text) {
    addMessage('user', text);
    input.value = '';
    autoResize();
    sendBtn.disabled = true;

    const traceWrap = createTraceMessage();

    try {
      const res = await fetch(apiBase + '/rrhh/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pregunta: text, session_id: sessionId }),
      });

      if (!res.ok || !res.body) {
        const err = await res.json().catch(() => ({}));
        traceWrap.remove();
        addMessage('system', 'Error ' + res.status + ': ' + (err.detail || 'no se pudo procesar la solicitud.'));
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const partes = buffer.split('\n\n');
        buffer = partes.pop(); // guarda el fragmento incompleto para el próximo chunk

        for (const parte of partes) {
          const linea = parte.trim();
          if (!linea.startsWith('data:')) continue;

          let evento;
          try { evento = JSON.parse(linea.slice(5).trim()); } catch (e) { continue; }

          if (evento.tipo === 'paso') {
            appendTraceLine(traceWrap, evento.linea);
          } else if (evento.tipo === 'final') {
            finalizeTraceMessage(traceWrap, evento.respuesta, evento.fuentes);
          } else if (evento.tipo === 'error') {
            traceWrap.remove();
            addMessage('system', 'Error: ' + evento.mensaje);
          }
        }
      }
    } catch (e) {
      traceWrap.remove();
      addMessage('system', 'No se pudo conectar con ' + apiBase + '. ¿Está el servidor corriendo?');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = input.value.trim();
      if (text) sendMessage(text);
    }
  });

  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (text) sendMessage(text);
  });

  promptsBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    sendMessage(btn.dataset.prompt);
  });

  settingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  saveSettings.addEventListener('click', () => {
    const val = apiBaseInput.value.trim().replace(/\/$/, '');
    if (val) {
      apiBase = val;
      store.set('agentApiBase', apiBase);
      checkHealth();
      addMessage('system', 'URL de la API actualizada a ' + apiBase);
    }
  });

  newSessionBtn.addEventListener('click', () => {
    sessionId = newSessionId();
    store.set('agentSessionId', sessionId);
    sessionIdView.value = sessionId;
    log.innerHTML = '';
    addMessage('system', 'Nueva conversación iniciada — la memoria previa quedó fuera de esta sesión.');
  });

  // ── Estado inicial ──────────────────────────────────
  addMessage('agent', 'Hola, soy el agente de Recursos Humanos de Technodistrib. ¿Qué quieres consultar hoy?');
  checkHealth();
  input.focus();
})();
</script>
